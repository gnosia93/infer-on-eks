<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#0f172a">GPU 추론 scale-out: 요청이 늘어난 뒤 새 replica가 서빙하기까지</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Qwen3-32B급 모델, SOCI 사용, compile 캐시 없음 기준 추정치. 0은 요청이 늘기 시작한 시점</text>

  <!-- 범례 -->
  <g font-size="13" fill="#334155">
    <line x1="640" y1="84" x2="664" y2="84" stroke="#dc2626" stroke-width="3"/>
    <text x="672" y="89">요청량</text>
    <line x1="734" y1="84" x2="758" y2="84" stroke="#334155" stroke-width="3"/>
    <text x="766" y="89">처리 용량 (A)</text>
    <line x1="870" y1="84" x2="894" y2="84" stroke="#059669" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="902" y="89">처리 용량 (B)</text>
    <rect x="1006" y="77" width="18" height="14" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="1032" y="89">넘친 요청</text>
  </g>

  <!-- 세로 격자 (1분 간격) -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="140" y1="100" x2="140" y2="500"/>
    <line x1="284" y1="100" x2="284" y2="500"/>
    <line x1="428" y1="100" x2="428" y2="500"/>
    <line x1="572" y1="100" x2="572" y2="500"/>
    <line x1="716" y1="100" x2="716" y2="500"/>
    <line x1="860" y1="100" x2="860" y2="500"/>
    <line x1="1004" y1="100" x2="1004" y2="500"/>
    <line x1="1148" y1="100" x2="1148" y2="500"/>
  </g>

  <!-- 넘친 요청 구간 (A 기준) -->
  <polygon points="165,205 260,140 1004,140 1004,205" fill="#fee2e2"/>
  <text x="790" y="179" font-size="14" fill="#991b1b" text-anchor="middle" paint-order="stroke" stroke="#fee2e2" stroke-width="4">넘친 요청이 대기열에 쌓이고 지연이 늘어남</text>

  <!-- 요청량, 처리 용량 -->
  <path d="M40 222 H140 L260 140 H1160" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M40 205 H1004 V125 H1160" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M572 205 V125 H1004" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- 표시 -->
  <circle cx="165" cy="205" r="5" fill="#dc2626"/>
  <text x="172" y="242" font-size="13" fill="#b91c1c" paint-order="stroke" stroke="#ffffff" stroke-width="4">↑ 이 순간 대기열이 생기고 대기열 지표가 바로 반응</text>
  <text x="580" y="117" font-size="13" fill="#047857">B는 여기서 해소</text>
  <text x="1012" y="117" font-size="13" fill="#334155">A는 여기서 해소</text>

  <!-- 시간 축 -->
  <line x1="140" y1="262" x2="1160" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="280" font-size="12" fill="#64748b">경과 시간</text>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="140" y="280">0</text>
    <text x="284" y="280">1분</text>
    <text x="428" y="280">2분</text>
    <text x="572" y="280">3분</text>
    <text x="716" y="280">4분</text>
    <text x="860" y="280">5분</text>
    <text x="1004" y="280">6분</text>
    <text x="1148" y="280">7분</text>
  </g>

  <!-- A 레인: 노드 추가 필요 -->
  <text x="140" y="316" font-size="15" font-weight="700" fill="#0f172a">A. GPU 노드를 새로 추가해야 할 때</text>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="140" y="326" width="84" height="32" fill="#6366f1"/>
    <rect x="224" y="326" width="432" height="32" fill="#f59e0b"/>
    <rect x="656" y="326" width="108" height="32" fill="#10b981"/>
    <rect x="764" y="326" width="168" height="32" fill="#0ea5e9"/>
    <rect x="932" y="326" width="72" height="32" fill="#8b5cf6"/>
  </g>
  <line x1="1004" y1="318" x2="1004" y2="366" stroke="#0f172a" stroke-width="2"/>
  <text x="1012" y="340" font-size="14" font-weight="700" fill="#0f172a">서빙 시작</text>
  <text x="1012" y="358" font-size="12" fill="#475569">대표 약 6분</text>
  <g text-anchor="middle">
    <text x="182" y="380" font-size="14" font-weight="700" fill="#3730a3">지표 감지</text>
    <text x="182" y="397" font-size="13" fill="#334155">15에서 60초</text>
    <text x="182" y="414" font-size="12" fill="#64748b">지표 수집, HPA 판단, pod 생성</text>

    <text x="440" y="380" font-size="14" font-weight="700" fill="#b45309">GPU 노드 프로비저닝</text>
    <text x="440" y="397" font-size="13" fill="#334155">1.5에서 5분</text>
    <text x="440" y="414" font-size="12" fill="#64748b">EC2 시작, 부팅, 클러스터 조인, GPU 드라이버 준비</text>

    <text x="710" y="380" font-size="14" font-weight="700" fill="#047857">이미지 pull</text>
    <text x="710" y="397" font-size="13" fill="#334155">25에서 50초</text>
    <text x="710" y="414" font-size="12" fill="#64748b">스케줄링, SOCI pull</text>

    <text x="848" y="380" font-size="14" font-weight="700" fill="#0369a1">vLLM 시작</text>
    <text x="848" y="397" font-size="13" fill="#334155">16에서 90초</text>
    <text x="848" y="414" font-size="12" fill="#64748b">가중치, compile, graph</text>

    <text x="968" y="380" font-size="14" font-weight="700" fill="#6d28d9">트래픽 연결</text>
    <text x="968" y="397" font-size="13" fill="#334155">15에서 40초</text>
    <text x="968" y="414" font-size="12" fill="#64748b">readiness, ALB</text>
  </g>

  <!-- B 레인: 여유 노드 있음 -->
  <text x="140" y="452" font-size="15" font-weight="700" fill="#0f172a">B. 여유 GPU 노드가 이미 있을 때 (노드 단계 없음)</text>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="140" y="462" width="84" height="32" fill="#6366f1"/>
    <rect x="224" y="462" width="108" height="32" fill="#10b981"/>
    <rect x="332" y="462" width="168" height="32" fill="#0ea5e9"/>
    <rect x="500" y="462" width="72" height="32" fill="#8b5cf6"/>
  </g>
  <line x1="572" y1="454" x2="572" y2="502" stroke="#0f172a" stroke-width="2"/>
  <text x="580" y="476" font-size="14" font-weight="700" fill="#0f172a">서빙 시작</text>
  <text x="580" y="494" font-size="12" fill="#475569">대표 약 3분, compile 캐시가 있으면 약 2분</text>
  <g text-anchor="middle">
    <text x="182" y="516" font-size="14" font-weight="700" fill="#3730a3">지표 감지</text>
    <text x="182" y="533" font-size="13" fill="#334155">15에서 60초</text>
    <text x="278" y="516" font-size="14" font-weight="700" fill="#047857">이미지 pull</text>
    <text x="278" y="533" font-size="13" fill="#334155">25에서 50초</text>
    <text x="416" y="516" font-size="14" font-weight="700" fill="#0369a1">vLLM 시작</text>
    <text x="416" y="533" font-size="13" fill="#334155">16에서 90초</text>
    <text x="536" y="516" font-size="14" font-weight="700" fill="#6d28d9">트래픽 연결</text>
    <text x="536" y="533" font-size="13" fill="#334155">15에서 40초</text>
  </g>

  <!-- 요약 -->
  <rect x="40" y="556" width="1120" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="582" font-size="15" font-weight="700" fill="#0f172a">왜 일찍 반응하는 지표로 확장을 시작해야 하나</text>
  <g font-size="14" fill="#334155">
    <text x="60" y="606">• 새 replica가 서빙하기 전까지 늘어난 요청은 기존 replica가 모두 받아야 하고, A처럼 노드를 추가하면 그 시간이 수 분입니다.</text>
    <text x="60" y="628">• 대기열 길이는 처리 용량을 넘는 순간 오르므로, 늦게 오르는 지표보다 이 타임라인 전체를 앞으로 당깁니다.</text>
    <text x="60" y="650">• 여유 노드로 노드 단계를 없애고(B), SOCI와 compile 캐시로 pod 단계를 줄이면 분홍색 구간이 짧아집니다.</text>
  </g>
  <text x="40" y="686" font-size="12" fill="#94a3b8">막대 길이는 대략적인 비율입니다. 시간 범위는 공개 측정값과 추정치를 이어 붙인 값이라 실제 환경에서 재서 확인해야 합니다.</text>
</svg>
