<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Image Generator</title>
</head>
<body>
  <form id="form">
    <input id="prompt" placeholder="프롬프트" required>
    <input id="image" type="file" accept="image/png,image/jpeg,image/webp">
    <button>생성</button>
  </form>
  <progress id="bar" max="1" value="0"></progress>
  <p id="status"></p>
  <img id="result" alt="">
  <script src="/app.js"></script>
</body>
</html>
